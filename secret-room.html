<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Room 🔐</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="secret-room">
<div id="app-decor"></div>
<div id="app-nav"></div>
<main class="page">
  <div class="eyebrow">Ruangan Rahasia</div>
  <h1>Secret Room 🔐</h1>

  <div id="lock-view" class="lock-screen">
    <div class="big">🔒</div>
    <p class="lede">Ruangan ini terkunci. Password-nya tersembunyi di halaman lain — coba explore Flower Garden, Little Notes, atau Mystery Box lebih teliti 👀</p>
    <input type="text" id="pw-input" class="pw" placeholder="Masukkan password...">
    <div class="btn-row"><button class="btn" id="pw-btn">Buka</button></div>
    <p style="color:var(--pink-500);font-size:.85rem;" id="pw-err"></p>
  </div>

  <div id="unlock-view" class="hidden">
    <div class="card center">
      <div style="font-size:2.4rem;">🎉</div>
      <p id="secret-content"></p>
    </div>
  </div>

  <div class="btn-row"><a class="btn secondary" href="achievements.html" id="next-link">Lanjut ke Achievements 🏆</a></div>
</main>
<script src="js/script.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", ()=>{
  const el = document.getElementById("secret-content");
  if(el) el.textContent = SITE_CONFIG.secretRoom.content;
});
</script>
</body>
</html>
